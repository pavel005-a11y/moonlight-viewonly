name: Moonlight View Only - Windows x64

on:
  push:
    branches:
      - feature/view-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: view-only-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2025

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Audit source guard coverage
        shell: pwsh
        run: python tests/test_viewonly_guard.py

      - name: Set CI version
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 6)
          "CI_VERSION=$shortSha" >> $env:GITHUB_ENV

      - name: Download Windows dependencies
        shell: pwsh
        run: ./setup-deps.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          tools: tools_qtcreator_gui
          set-env: false
          version: 6.12.0
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e

      - name: Compile and package Windows x64
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release x64
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\6.12.0\msvc2022_64\bin

      - name: Upload portable Windows ZIP
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-ViewOnly-Windows-x64
          path: build/installer-x64-release/MoonlightPortable-x64-*.zip
          if-no-files-found: error
          retention-days: 14
